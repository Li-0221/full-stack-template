repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --fix --cache-dir backend/.ruff_cache
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --check --cache-dir backend/.ruff_cache
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --project backend mypy --cache-dir backend/.mypy_cache --config-file backend/pyproject.toml backend/src
        language: system
        pass_filenames: false
